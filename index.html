<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ournotes 活動點數預測計算器</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --primary: #818cf8;
      --primary-hover: #6366f1;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --card-inner: #0f172a;
      --pt-color: #60a5fa;
      --medal-color: #fbbf24;
      --live-color: #34d399;
      --hint-red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .calculator-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 800;
      text-align: center;
      color: var(--primary);
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    label {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
    }

    .limit-badge {
      font-size: 0.75rem;
      color: var(--text-muted);
      background: #334155;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    input[type="number"], select {
      width: 100%;
      padding: 10px 14px;
      font-size: 1rem;
      font-weight: 500;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      outline: none;
      background-color: #0f172a;
      color: var(--text);
      transition: all 0.2s ease;
    }

    input[type="number"]:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.25);
    }

    .unit {
      position: absolute;
      right: 14px;
      color: var(--text-muted);
      font-weight: 600;
      pointer-events: none;
    }

    .sub-hint-red {
      margin-top: 6px;
      font-size: 0.78rem;
      color: var(--hint-red);
      line-height: 1.35;
      font-weight: 500;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      align-items: start;
    }

    .results-panel {
      margin-top: 24px;
      background: var(--card-inner);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }

    .panel-header {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 12px;
    }

    .result-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 4px;
      border-bottom: 1px dashed var(--border);
    }

    .result-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .result-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
    }

    .result-val {
      font-size: 1.35rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .pt-val { color: var(--pt-color); }
    .medal-val { color: var(--medal-color); }
    .live-val { color: var(--live-color); }

    .formula-note {
      margin-top: 16px;
      font-size: 0.78rem;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.4;
    }

    .author-footer {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .author-footer strong {
      color: var(--text);
    }

    .author-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .author-footer a:hover {
      text-decoration: underline;
    }

    .highlight-id {
      font-family: monospace;
      font-size: 0.85rem;
      background: #334155;
      padding: 1px 6px;
      border-radius: 4px;
      color: #f8fafc;
    }
  </style>
</head>
<body>

  <div class="calculator-card">
    <h1>Ournotes 活動點數預測計算器</h1>

    <!-- 1. 隊伍加成 -->
    <div class="form-group">
      <div class="label-row">
        <label for="ptBonus">隊伍加成</label>
        <span class="limit-badge">上限 500%</span>
      </div>
      <div class="input-wrapper">
        <input type="number" id="ptBonus" value="375" min="0" max="500" step="1">
        <span class="unit">%</span>
      </div>
    </div>

    <!-- 2. 快照加成 -->
    <div class="form-group">
      <div class="label-row">
        <label for="medalBonus">快照加成</label>
        <span class="limit-badge">上限 500%</span>
      </div>
      <div class="input-wrapper">
        <input type="number" id="medalBonus" value="375" min="0" max="500" step="1">
        <span class="unit">%</span>
      </div>
    </div>

    <!-- 3. 評分 & 4. 消耗火數 -->
    <div class="grid-2">
      <div class="form-group">
        <div class="label-row">
          <label for="teamRank">評分</label>
        </div>
        <select id="teamRank">
          <option value="SS">SS 級</option>
          <option value="S">S 級</option>
          <option value="A" selected>A 級</option>
          <option value="B">B 級</option>
          <option value="C">C 級</option>
          <option value="D">D 級</option>
        </select>
        <div class="sub-hint-red">若為激奏演出請填團體評分，若為自由演出請填最終評分</div>
      </div>

      <div class="form-group">
        <div class="label-row">
          <label for="fireCount">消耗火數 (倍數)</label>
        </div>
        <select id="fireCount">
          <option value="1">0 火 (1倍)</option>
          <option value="5">1 火 (5倍)</option>
          <option value="10">2 火 (10倍)</option>
          <option value="15">3 火 (15倍)</option>
          <option value="20">4 火 (20倍)</option>
          <option value="25">5 火 (25倍)</option>
          <option value="30">6 火 (30倍)</option>
          <option value="35">7 火 (35倍)</option>
          <option value="40">8 火 (40倍)</option>
          <option value="45">9 火 (45倍)</option>
          <option value="50" selected>10 火 (50倍)</option>
        </select>
      </div>
    </div>

    <!-- 預測結果展示 -->
    <div class="results-panel">
      <div class="panel-header">預測最終結算獲得</div>
      <div class="result-item">
        <span class="result-name">活動 PT</span>
        <span class="result-val pt-val" id="resPT">0</span>
      </div>
      <div class="result-item">
        <span class="result-name">活動獎章</span>
        <span class="result-val medal-val" id="resMedal">0</span>
      </div>
      <div class="result-item">
        <span class="result-name">Live PT</span>
        <span class="result-val live-val" id="resLivePT">0</span>
      </div>
    </div>

    <div class="formula-note">
      * 最終點數採無條件捨去（Floor）計算。<br>
      * 個人單獨評分不影響收益，以全場總和結算的「評分」為準。
    </div>

    <!-- 作者與聯絡資訊 -->
    <div class="author-footer">
      <div>以上是適用激奏演出以及自由演出</div>
      <div>如有重大問題可以聯繫：</div>
      <div>作者：<strong>巧克力</strong></div>
      <div>IG：<a href="https://www.instagram.com/chocolate_09.21/" target="_blank" rel="noopener noreferrer">chocolate_09.21</a></div>
      <div>國際服 ID：<span class="highlight-id">28221772576</span></div>
    </div>
  </div>

  <script>
    // 全階級實測完整定案常數表
    const RANK_CONFIG = {
      'SS': { pt: 100, medal: 120, livePt: 10 },
      'S':  { pt: 75,  medal: 90,  livePt: 8 },
      'A':  { pt: 50,  medal: 60,  livePt: 6 },
      'B':  { pt: 35,  medal: 42,  livePt: 5 },
      'C':  { pt: 25,  medal: 30,  livePt: 4 },
      'D':  { pt: 15,  medal: 18,  livePt: 3 }
    };

    const ptInput = document.getElementById('ptBonus');
    const medalInput = document.getElementById('medalBonus');
    const rankSelect = document.getElementById('teamRank');
    const fireSelect = document.getElementById('fireCount');

    const resPT = document.getElementById('resPT');
    const resMedal = document.getElementById('resMedal');
    const resLivePT = document.getElementById('resLivePT');

    function calculate() {
      let ptBonus = parseFloat(ptInput.value) || 0;
      let medalBonus = parseFloat(medalInput.value) || 0;

      if (ptBonus < 0) ptBonus = 0;
      if (ptBonus > 500) {
        ptBonus = 500;
        ptInput.value = 500;
      }

      if (medalBonus < 0) medalBonus = 0;
      if (medalBonus > 500) {
        medalBonus = 500;
        medalInput.value = 500;
      }

      const rank = rankSelect.value;
      const multiplier = parseInt(fireSelect.value, 10);
      const base = RANK_CONFIG[rank];

      // 純整數運算避免浮點數精度誤差
      const livePt = base.livePt * multiplier;
      const pt = Math.floor((base.pt * (100 + ptBonus) * multiplier) / 100);
      const medal = Math.floor((base.medal * (100 + medalBonus) * multiplier) / 100);

      resPT.textContent = pt.toLocaleString();
      resMedal.textContent = medal.toLocaleString();
      resLivePT.textContent = livePt.toLocaleString();
    }

    [ptInput, medalInput, rankSelect, fireSelect].forEach(el => {
      el.addEventListener('input', calculate);
      el.addEventListener('change', calculate);
    });

    calculate();
  </script>
</body>
</html>
